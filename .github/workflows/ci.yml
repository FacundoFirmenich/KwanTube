name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python src/qmc_mt/test_ns_consistency.py

      - name: Bayesian HEOM v2 smoke
        run: |
          python src/scripts/analysis/bayesian_heom_hierarchy_v2.py outputs_data/raw_csv/heom_+bayesian_analysis/heom_bayes_input_current.csv --output-dir heom_bayes_out_v2_ci --draws 400

      - name: Reproducibility smoke
        run: |
          python src/scripts/validation/reproduce_paper_results.py --fast

      - name: Figures smoke
        run: |
          python src/scripts/figures/generate_paper_figures.py

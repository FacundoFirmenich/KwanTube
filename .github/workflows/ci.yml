name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest scripts/test_ns_consistency.py -v

      - name: Bayesian HEOM v2 smoke
        run: |
          python scripts/bayesian_heom_hierarchy_v2.py src/heom_bayes_input_current.csv --output-dir heom_bayes_out_v2_ci --draws 4000

      - name: Reproducibility smoke
        run: |
          python scripts/reproduce_paper_results.py --fast

      - name: Figures smoke
        run: |
          python scripts/generate_paper_figures.py


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qmc_mt"
version = "3.5.0"
description = "Quantum Microtubule Coherence Framework with KwanPy bootstrap namespace"
authors = [{ name = "Anonymous", email = "research@example.com" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib"
]
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]
